<script type="module">

  /* =====================================================
     FIREBASE IMPORT
  ===================================================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    runTransaction,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyDToak9j8PnMZ2Jflm9dqY5EQbBth8wqHk",

    authDomain:
      "aplikasi-d862d.firebaseapp.com",

    projectId:
      "aplikasi-d862d",

    storageBucket:
      "aplikasi-d862d.firebasestorage.app",

    messagingSenderId:
      "491134919372",

    appId:
      "1:491134919372:web:63fde8d8d32eb8820e1869",

    measurementId:
      "G-3TK6ZQGMDP",

    databaseURL:
      "https://aplikasi-d862d-default-rtdb.asia-southeast1.firebasedatabase.app"

  };


  /* =====================================================
     INITIALIZE FIREBASE
  ===================================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  /* =====================================================
     USER ANONIM
  ===================================================== */

  let currentUser = null;


  signInAnonymously(auth)
    .catch(error => {

      console.error(
        "Firebase Authentication Error:",
        error
      );

    });


  onAuthStateChanged(
    auth,
    user => {

      if (!user) {
        return;
      }

      currentUser = user;

      console.log(
        "Clover User ID:",
        currentUser.uid
      );

      listenToMessages();

    }
  );


  /* =====================================================
     HELPER
  ===================================================== */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;

  }


  /* =====================================================
     PAPAN KEHANGATAN
  ===================================================== */

  const messagesRef =
    ref(database, "messages");


  function listenToMessages() {

    onValue(
      messagesRef,

      snapshot => {

        const data =
          snapshot.val();

        const messages = [];


        if (data) {

          Object.entries(data)
            .forEach(
              ([id, message]) => {

                messages.push({

                  id: id,

                  text:
                    message.text || "",

                  sender:
                    message.sender || "Anonim",

                  likes:
                    Number(message.likes) || 0,

                  likedBy:
                    message.likedBy || {},

                  createdAt:
                    message.createdAt || 0

                });

              }
            );

        }


        messages.sort(
          (a, b) =>
            Number(b.createdAt || 0) -
            Number(a.createdAt || 0)
        );


        renderMessages(messages);

      },

      error => {

        console.error(
          "Gagal membaca pesan:",
          error
        );

      }
    );

  }


  /* =====================================================
     TAMPILKAN PESAN
  ===================================================== */

  function renderMessages(messages) {

    const container =
      document.getElementById(
        "messages-container"
      );


    if (!messages.length) {

      container.innerHTML = `

        <article
          class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm"
        >

          <p class="text-slate-700 text-sm leading-relaxed">
            "Ingatlah bahwa awan mendung tidak bertahan selamanya.
            Kamu berharga dan kehadiranmu berarti!"
          </p>

          <div
            class="text-xs text-slate-400 mt-3"
          >
            — Sahabat Anonim
          </div>

        </article>

      `;

      return;

    }


    container.innerHTML =
      messages.map(
        message => {

          const userLiked =
            currentUser &&
            message.likedBy &&
            message.likedBy[currentUser.uid];


          return `

            <article
              class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-3"
            >

              <p
                class="text-slate-700 text-sm leading-relaxed"
              >
                "${escapeHTML(message.text)}"
              </p>


              <div
                class="flex justify-between items-center text-xs text-slate-400 gap-3"
              >

                <span>
                  — ${escapeHTML(
                    message.sender || "Anonim"
                  )}
                </span>


                <button
                  type="button"
                  data-like-id="${escapeHTML(message.id)}"
                  class="like-button flex items-center gap-1 text-rose-500 hover:text-rose-600 font-medium"
                >

                  <i
                    class="${
                      userLiked
                        ? "fa-solid"
                        : "fa-regular"
                    } fa-heart"
                  ></i>

                  <span>
                    ${Number(message.likes) || 0}
                  </span>

                </button>

              </div>

            </article>

          `;

        }
      ).join("");


    container
      .querySelectorAll(
        "[data-like-id]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            likeMessage(
              button.dataset.likeId
            );

          }
        );

      });

  }


  /* =====================================================
     KIRIM PESAN KE FIREBASE
  ===================================================== */

  document
    .getElementById("message-form")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        if (!currentUser) {

          alert(
            "Clover sedang menghubungkan ke server. Silakan coba lagi."
          );

          return;

        }


        const messageInput =
          document.getElementById(
            "message-input"
          );

        const senderInput =
          document.getElementById(
            "sender-input"
          );


        const text =
          messageInput.value.trim();

        const sender =
          senderInput.value.trim() ||
          "Anonim";


        if (!text) {
          return;
        }


        try {

          const newMessage =
            push(messagesRef);


          await set(
            newMessage,
            {

              text:
                text,

              sender:
                sender,

              likes:
                0,

              likedBy:
                {},

              createdAt:
                serverTimestamp(),

              userId:
                currentUser.uid

            }
          );


          this.reset();


        } catch (error) {

          console.error(
            "Gagal mengirim pesan:",
            error
          );

          alert(
            "Pesan gagal dikirim. Periksa koneksi atau Firebase Rules."
          );

        }

      }
    );


  /* =====================================================
     LIKE PESAN
  ===================================================== */

  async function likeMessage(messageId) {

    if (!currentUser) {
      return;
    }


    if (!messageId) {
      return;
    }


    const messageRef =
      ref(
        database,
        `messages/${messageId}`
      );


    try {

      await runTransaction(
        messageRef,

        currentData => {

          if (!currentData) {
            return;
          }


          if (!currentData.likedBy) {

            currentData.likedBy = {};

          }


          const alreadyLiked =
            currentData.likedBy[
              currentUser.uid
            ] === true;


          if (alreadyLiked) {

            delete currentData.likedBy[
              currentUser.uid
            ];

            currentData.likes =
              Math.max(
                0,
                (Number(currentData.likes) || 0) - 1
              );

          } else {

            currentData.likedBy[
              currentUser.uid
            ] = true;

            currentData.likes =
              (Number(currentData.likes) || 0) + 1;

          }


          return currentData;

        }
      );

    } catch (error) {

      console.error(
        "Gagal memberikan like:",
        error
      );

    }

  }


  /* =====================================================
     NOTE SAMPAH
     KELUHAN TIDAK DIKIRIM KE FIREBASE
  ===================================================== */

  const complaintInput =
    document.getElementById(
      "complaint-input"
    );

  const throwComplaintButton =
    document.getElementById(
      "throw-complaint"
    );

  const encouragementBox =
    document.getElementById(
      "encouragement-box"
    );

  const encouragementText =
    document.getElementById(
      "encouragement-text"
    );


  const encouragementMessages = [

    "Tidak semua hal harus kamu selesaikan hari ini. Beri dirimu waktu untuk bernapas. Kamu tetap berharga. 🍀",

    "Apa yang kamu rasakan itu valid. Jangan terlalu keras kepada dirimu sendiri. Kamu sudah berusaha sejauh ini.",

    "Hari yang berat bukan berarti hidupmu akan selalu berat. Perlahan saja, masih ada hari baik yang menunggumu.",

    "Kamu tidak harus selalu kuat. Tidak apa-apa untuk merasa lelah dan mengambil waktu untuk beristirahat.",

    "Satu masalah tidak menentukan seluruh hidupmu. Ambil napas, tenangkan diri, lalu lanjutkan sedikit demi sedikit.",

    "Mungkin hari ini terasa sepi, tetapi itu bukan berarti kamu tidak berarti. Kehadiranmu tetap berharga. 💚",

    "Terima kasih sudah berani mengeluarkan apa yang kamu rasakan. Sekarang, beri dirimu kesempatan untuk melangkah lagi.",

    "Tidak perlu membandingkan perjalananmu dengan orang lain. Setiap orang punya waktunya sendiri. 🌱"

  ];


  function getRandomEncouragement() {

    const randomIndex =
      Math.floor(
        Math.random() *
        encouragementMessages.length
      );

    return encouragementMessages[
      randomIndex
    ];

  }


  throwComplaintButton.addEventListener(
    "click",
    function() {

      const complaint =
        complaintInput.value.trim();


      if (!complaint) {

        complaintInput.focus();

        complaintInput.placeholder =
          "Tulis dulu keluhanmu sebelum membuangnya...";

        return;

      }


      /*
        KELUHAN TIDAK DISIMPAN.
        TIDAK MASUK FIREBASE.
      */

      complaintInput.value = "";


      encouragementText.textContent =
        getRandomEncouragement();


      encouragementBox.classList.remove(
        "hidden"
      );


      encouragementBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }
  );


  /* =====================================================
     CLOVER CHALLENGE
     PROGRESS MASING-MASING USER
  ===================================================== */

  const checkboxes =
    document.querySelectorAll(
      ".challenge-checkbox"
    );


  const STORAGE_CHALLENGES =
    "clover_challenges";


  function loadChallenges() {

    try {

      const saved =
        JSON.parse(
          localStorage.getItem(
            STORAGE_CHALLENGES
          )
        );


      if (
        Array.isArray(saved) &&
        saved.length === checkboxes.length
      ) {

        return saved;

      }

    } catch (error) {

      console.error(error);

    }


    return new Array(
      checkboxes.length
    ).fill(false);

  }


  function saveChallenges(
    challenges
  ) {

    localStorage.setItem(
      STORAGE_CHALLENGES,
      JSON.stringify(challenges)
    );

  }


  function updateChallengeProgress() {

    const challenges =
      loadChallenges();


    const completed =
      challenges.filter(Boolean).length;


    const leaves =
      Math.min(
        completed,
        5
      );


    const percentage =
      challenges.length === 0
        ? 0
        : (
            completed /
            challenges.length
          ) * 100;


    document.getElementById(
      "completed-count"
    ).textContent =
      completed;


    document.getElementById(
      "progress-bar"
    ).style.width =
      `${percentage}%`;


    const leafElements =
      document.querySelectorAll(
        "#leaf-progress .leaf"
      );


    leafElements.forEach(
      (leaf, index) => {

        leaf.classList.toggle(
          "active",
          index < leaves
        );

        leaf.classList.toggle(
          "inactive",
          index >= leaves
        );

      }
    );


    document.getElementById(
      "leaf-text"
    ).textContent =
      `${leaves} daun terkumpul`;


    const progressMessage =
      document.getElementById(
        "progress-message"
      );

    const completionMessage =
      document.getElementById(
        "completion-message"
      );


    if (completed === 0) {

      progressMessage.textContent =
        "Tidak apa-apa. Setiap langkah dimulai dari satu hal kecil.";

      completionMessage.textContent =
        "🌱 Tidak perlu terburu-buru. Satu langkah kecil sudah berarti.";

    }

    else if (completed === 1) {

      progressMessage.textContent =
        "Satu langkah kecil sudah kamu ambil. 🌱";

      completionMessage.textContent =
        "🍃 Kamu sudah memulai. Itu adalah hal yang berarti.";

    }

    else if (completed <= 3) {

      progressMessage.textContent =
        "Kamu mulai membuka ruang untuk koneksi baru.";

      completionMessage.textContent =
        "🌿 Perlahan, kamu sedang membangun koneksi.";

    }

    else if (completed === 4) {

      progressMessage.textContent =
        "Hubungan tumbuh dari langkah-langkah kecil.";

      completionMessage.textContent =
        "🌿 Sedikit lagi. Terus lakukan dengan caramu sendiri.";

    }

    else if (
      completed >= 5 &&
      completed < 8
    ) {

      progressMessage.textContent =
        "Clover-mu mulai lengkap! Terima kasih sudah berani terhubung. 🍀";

      completionMessage.textContent =
        "🍀 Kamu sudah mengumpulkan 5 daun. Setiap koneksi kecil memiliki arti.";

    }

    else {

      progressMessage.textContent =
        "Clover-mu lengkap! Kamu sudah menyelesaikan semua tantangan. 🍀";

      completionMessage.textContent =
        "🌳 Hebat! Kamu telah menyelesaikan seluruh Clover Challenge.";

    }

  }


  function initializeChallenges() {

    const challenges =
      loadChallenges();


    checkboxes.forEach(
      (checkbox, index) => {

        checkbox.checked =
          challenges[index] || false;


        checkbox
          .closest("label")
          .classList.toggle(
            "task-done",
            checkbox.checked
          );


        checkbox.addEventListener(
          "change",
          () => {

            const currentChallenges =
              loadChallenges();


            currentChallenges[index] =
              checkbox.checked;


            saveChallenges(
              currentChallenges
            );


            checkbox
              .closest("label")
              .classList.toggle(
                "task-done",
                checkbox.checked
              );


            updateChallengeProgress();

          }
        );

      }
    );


    updateChallengeProgress();

  }


  /* =====================================================
     FOOTER
  ===================================================== */

  document.getElementById(
    "year"
  ).textContent =
    new Date().getFullYear();


  /* =====================================================
     INITIALIZE
  ===================================================== */

  initializeChallenges();

</script>
