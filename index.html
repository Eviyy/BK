<!-- <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clover - Rumah baru telah siap.">
    <meta name="theme-color" content="#10b981">

    <!-- Auto redirect setelah 5 detik -->
    <meta http-equiv="refresh" content="5;url=https://eviyy.github.io/CloverKTS/">

    <title>Clover — Berpindah ke Rumah Baru</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
        .bg-clover {
            position: fixed;
            color: #10b981;
            animation: float-up linear infinite;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Floating Clovers -->
    <div>
        <i class="fa-solid fa-clover bg-clover text-2xl" style="left: 10%; animation-duration: 18s; animation-delay: 0s;"></i>
        <i class="fa-solid fa-clover bg-clover text-4xl" style="left: 35%; animation-duration: 25s; animation-delay: 4s;"></i>
        <i class="fa-solid fa-clover bg-clover text-xl"  style="left: 60%; animation-duration: 20s; animation-delay: 2s;"></i>
        <i class="fa-solid fa-clover bg-clover text-3xl" style="left: 85%; animation-duration: 22s; animation-delay: 7s;"></i>
    </div>

    <!-- Migration Card -->
    <div class="bg-white/90 backdrop-blur-md rounded-[2.5rem] p-8 md:p-12 max-w-lg w-full shadow-2xl border border-slate-100 text-center space-y-6 relative z-10">
        
        <div class="w-16 h-16 rounded-3xl bg-emerald-500 text-white flex items-center justify-center mx-auto text-3xl shadow-lg shadow-emerald-500/30">
            <i class="fa-solid fa-house-chimney-window"></i>
        </div>

        <div class="space-y-2">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-wider">
                Pemberitahuan Penting 🍀
            </span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                Clover Pindah Rumah Baru!
            </h1>
            <p class="text-xs md:text-sm text-slate-500 font-medium leading-relaxed pt-2">
                Halo! Ruang hangat Clover kini berpindah alamat agar menjadi lebih baik dan nyaman. Anda akan diarahkan secara otomatis dalam <span id="countdown" class="font-extrabold text-emerald-600" aria-live="polite">5</span> detik.
            </p>
        </div>

        <div class="pt-2 space-y-3">
            <a href="https://eviyy.github.io/CloverKTS/" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-4 px-6 rounded-2xl transition-all shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2">
                <span>Kunjungi Rumah Baru Clover</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
            
            <p class="text-[11px] text-slate-400 font-medium">
                Atau salin tautan baru: <br>
                <code class="text-emerald-700 font-bold bg-emerald-50 px-2 py-1 rounded-lg mt-1 inline-block">https://eviyy.github.io/CloverKTS/</code>
            </p>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            if (countdownEl) {
                countdownEl.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.replace("https://eviyy.github.io/CloverKTS/");
            }
        }, 1000);
    </script>
</body>
</html>
