<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Latar Belakang Kotak Melengkung (Squircle) Warna Hijau Teal -->
    <rect width="512" height="512" rx="120" fill="#14b8a6" />
    
    <!-- Simbol Semanggi 4 Daun Putih Simetris -->
    <g fill="#ffffff" transform="translate(256, 256)">
        <!-- Daun Atas -->
        <path d="M 0,-20 C -35,-20 -55,-55 -35,-85 C -15,-115 15,-115 35,-85 C 55,-55 35,-20 0,-20 Z" />
        <!-- Daun Kanan -->
        <path d="M 20,0 C 20,-35 55,-55 85,-35 C 115,-15 115,15 85,35 C 55,55 20,35 20,0 Z" />
        <!-- Daun Bawah -->
        <path d="M 0,20 C 35,20 55,55 35,85 C 15,115 -15,115 -35,85 C -55,55 -35,20 0,20 Z" />
        <!-- Daun Kiri -->
        <path d="M -20,0 C -20,35 -55,55 -85,35 C -115,15 -115,-15 -85,-35 C -55,-55 -20,-35 -20,0 Z" />
        <!-- Pusat Tengah Semanggi -->
        <circle cx="0" cy="0" r="22" />
    </g>
</svg>
